{% extends 'base.html' %}

{% block content %}

<style>
    :root {
        --color-primario: #b91c1c;     /* Rojo Sólido */
        --color-secundario: #1d3557;   /* Azul Marino (Acento) */
        --color-bg: #ffffff;           /* Fondo Blanco */
        --color-text: #1e293b;
        --border-gray: #e2e8f0;
    }



    /* ========== HEADER UNIFICADO ========== */
    header {
        background: var(--color-primario) !important;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border-bottom: 5px solid var(--color-secundario);
        margin-bottom: 3rem;
        height: 100px !important;
        font-family: 'Segoe UI', system-ui, sans-serif;
        padding: 1rem 0 !important;
    }

    header h1 {
        color: white !important;
        font-weight: bold !important;
        text-transform: uppercase;
        margin-top: 1rem;
        font-family: 'Segoe UI', system-ui, sans-serif;
        letter-spacing: -0.5px;
    }

    header p {
        color: white !important;
        margin-top: 1px;
    }

    /* ========== DISEÑO DE 2 COLUMNAS (FLEXBOX) ========== */
    .dashboard-grid {
        display: flex;
        gap: 2rem;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
    }

    .column {
        flex: 1; /* Esto hace que ambas columnas midan lo mismo */
    }

    .custom-card {
        background: #ffffff !important;
        border: 1px solid var(--border-gray) !important;
        border-radius: 12px !important;
        height: 100%; /* Para que ambas tarjetas midan lo mismo de alto */
    }

    .card-body {
        padding: 2.5rem !important;
    }

    /* ========== TÍTULOS LIMPIOS (SIN ICONOS BI-BI) ========== */
    .custom-card h5 {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--color-primario);
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid #f1f5f9;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    /* Pequeño detalle azul al inicio del título en lugar del icono bi-bi */
    .custom-card h5::before {
        content: "|";
        color: var(--color-secundario);
        margin-right: 10px;
        font-weight: 900;
    }

    /* ========== FORMULARIOS ========== */
    form p { margin-bottom: 1.5rem; }
    
    label {
        font-weight: 600;
        font-size: 0.85rem;
        display: block;
        margin-bottom: 0.5rem;
    }

    input, select, textarea {
        width: 100%;
        padding: 0.8rem 1rem;
        border-radius: 8px;
        border: 1px solid var(--border-gray);
        background: #fcfcfc;
        box-sizing: border-box;
    }

    input:focus {
        outline: none;
        border-color: var(--color-secundario) !important;
        box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
    }

    /* ========== BOTÓN ========== */
    .submit-container {
        text-align: center;
        margin: 3rem 0;
        width: 100%;
    }

    .btn-save {
        background: var(--color-primario) !important;
        color: white !important;
        border: none !important;
        padding: 14px 60px !important;
        border-radius: 8px !important;
        font-weight: 700 !important;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .btn-save:hover {
        transform: translateY(-2px);
        background: #700101 !important;
    }

    /* Responsivo: Una columna en móviles */
    @media (max-width: 850px) {
        .dashboard-grid {
            flex-direction: column;
        }
    }
</style>

<!-- HEADER ELEGANTE -->
<header>
    <h1>Factura & Envío</h1>
      <p>Tu compra segura, tu entrega puntual</p>
</header>

<!-- SECCIÓN PRINCIPAL -->
    <div class="container">
        <form method="POST" action="{% url 'update_info' %}">
            {% csrf_token %}
            <div class="dashboard-grid">
            <!-- Columna 1 -->
            <div class="column">
                <div class="custom-card">
                    <div class="card-body">
                        <h5>Facturación</h5>
                            {{ form.as_p }}
                        </div>
                    </div>
                </div>
                

                <!-- Shipping Information -->
               <div class="column">
                <div class="custom-card">
                    <div class="card-body">
                        <h5>Envío</h5>
                            {{ shipping_form.as_p }}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botón centrado -->
            <div class="submit-container">
            <button type="submit" class="btn-save">
                Guardar Cambios
            </button>
            </div>
        </form>
    </div>

{% endblock %}
